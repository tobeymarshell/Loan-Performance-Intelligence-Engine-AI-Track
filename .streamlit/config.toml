# 1. Create the directories if you haven't already
mkdir -p .streamlit static

# 2. Copy or save your report into static/
cp outputs/data_profiling_report.html static/data_profiling_report.html

# 3. Stage the new configuration and static files
git add .streamlit/config.toml static/data_profiling_report.html app.py

# 4. Commit and push
git commit -m "Add static file serving configuration for HTML report"
git push origin main
